services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ssa_frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      disable: true
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ssa_net

networks:
  ssa_net:
    external: true
    name: ssa_net